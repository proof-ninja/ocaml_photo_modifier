name: Build as Artifacts

on:
  - push
  - pull_request

permissions: read-all

env:
  OCAMLRUNPARAM: "b"

jobs:
  build-and-test:
    permissions:
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          - 5
        exclude:
          - os: macos-latest
            ocaml-compiler: 4

    runs-on: ${{ matrix.os }}

    steps:
      # Ubuntuの場合のみ実行
      - name: Run apt-get update
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng12-dev libjpeg-dev libtiff-dev libxpm-dev libfreetype6-dev libgif-dev

      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: _build/default/bin/main.exe

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.ocaml-compiler }}-main.exe
          path: _build/default/bin/main.exe

      - name: Run Example
        run: cd sample && echo "hoge" | ../_build/default/bin/main.exe
