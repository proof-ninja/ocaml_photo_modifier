name: Build as Artifacts

on:
  - push
  - pull_request

permissions: read-all

env:
  OCAMLRUNPARAM: "b"

jobs:
  build-and-test:
    permissions:
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ocaml-compiler:
          # https://gitlab.com/camlspotter/camlimages/-/issues/6
          - 5.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3.3.5
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Ubuntuの場合のみ実行
      - name: Install libjpeg on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev
      
      # Windowsの場合のみ実行
      - name: Install libjeng on Windows
        if: matrix.os == 'windows-latest'
        run: |
          D:\setup-x86_64.exe --quiet-mode --symlink-type=sys --upgrade-also --local-package-dir=D:\cygwin\packages --packages=libjpeg-devel --root=D:\cygwin --site=https://mirrors.kernel.org/sourceware/cygwin/

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune runtest

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: _build/default/bin/main.exe

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.ocaml-compiler }}-main.exe
          path: _build/default/bin/main.exe

      - name: Run Example
        run: cd sample && echo "hoge" | ../_build/default/bin/main.exe
